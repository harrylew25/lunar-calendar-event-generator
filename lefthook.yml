pre-push:
  jobs:
    - name: typescript check
      run: bun run typecheck

    - name: unit tests check
      run: bun run test

pre-commit:
  jobs:
    - name: biome check formatting
      run: bunx biome check --write --files-ignore-unknown=true --no-errors-on-unmatched -- {staged_files}
      glob: 
        - "*.{ts,tsx,js,json,html,css}"
        - "**/*.{ts,tsx,js,json,html,css}"
      stage_fixed: true

prepare-commit-msg:
  skip:
    - merge
    - rebase
    - ref: develop
    - ref: staging
    - ref: release
    - ref: release/*
  jobs:
    - name: prepend ENG ticket
      run: bun scripts/prepend-eng-ticket.ts {1} {2}

commit-msg:
  skip:
    - merge
    - rebase
    - ref: develop
    - ref: staging
    - ref: release
    - ref: release/*
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
