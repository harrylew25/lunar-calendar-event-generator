name: CI checks

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
        
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install 
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck 

      - name: Run tests
        run: bun test
        env:
          TZ: Asia/Kuala_Lumpur

      - name: Run lint
        run: bunx biome ci

      - name: Build
        run: bun run build

      - name: Audit
        continue-on-error: true
        run: bun audit