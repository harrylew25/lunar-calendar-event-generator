# ENG-30: after listing, delete merged-PR heads idle ≥ 3 days (tip commit, not
# mergedAt). Skip develop, staging, release, release/*, open PRs, unmerged
# heads, and forks. Empty lists are normal if GitHub auto-deletes on merge.
#
# Weekly cron: Sunday 16:00 UTC = Monday 00:00 Asia/Kuala_Lumpur (always
# deletes). Manual Run workflow is a dry-run unless delete=true.
# Disable this workflow to stop the cron.

name: Post merged branch

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      idle_days:
        description: Days since the tip commit before a merged-PR head is idle. Use 0 to list leftover heads immediately.
        required: false
        default: "3"
      delete:
        description: Delete listed branches. Leave off for a dry-run. Weekly schedule always deletes.
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  list-idle-merged:
    runs-on: ubuntu-24.04
    env:
      SHOULD_DELETE: ${{ github.event_name == 'schedule' || inputs.delete }}
    steps:
      - name: List idle merged-PR heads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          IDLE_DAYS: ${{ inputs.idle_days || '3' }}
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATES_FILE="${RUNNER_TEMP}/idle-merged-candidates.txt"
          IDLE_DAYS="${IDLE_DAYS:-3}"
          if ! [[ "$IDLE_DAYS" =~ ^[0-9]+$ ]]; then
            echo "::error::idle_days must be a non-negative integer, got: ${IDLE_DAYS}"
            exit 1
          fi

          : > "$CANDIDATES_FILE"

          CUTOFF="$(date -u -d "${IDLE_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ')"
          CUTOFF_EPOCH="$(date -u -d "$CUTOFF" '+%s')"

          echo "Repository: ${GH_REPO}"
          echo "event: ${EVENT_NAME}"
          echo "Cutoff (UTC): ${CUTOFF}"
          echo "idle_days: ${IDLE_DAYS}"
          if [[ "$SHOULD_DELETE" == "true" ]]; then
            echo "Mode: DELETE after this log"
          else
            echo "DRY-RUN: no branches will be deleted"
          fi
          echo ""

          is_protected() {
            local branch="$1"
            [[ "$branch" == "develop" || "$branch" == "staging" || "$branch" == "release" || "$branch" == release/* ]]
          }

          uri_encode() {
            jq -nr --arg s "$1" '$s | @uri'
          }

          open_json="$(gh pr list --repo "$GH_REPO" --state open --limit 1000 --json headRefName,isCrossRepository)"
          merged_json="$(gh pr list --repo "$GH_REPO" --state merged --limit 1000 --json number,headRefName,isCrossRepository,mergedAt)"
          branches="$(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name')"

          declare -A OPEN_HEADS=()
          declare -A MERGED_PR=()

          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            OPEN_HEADS["$name"]=1
          done < <(jq -r '.[] | select(.isCrossRepository | not) | .headRefName' <<<"$open_json")

          while IFS=$'\t' read -r name number; do
            [[ -z "$name" ]] && continue
            MERGED_PR["$name"]="$number"
          done < <(
            jq -r '
              [.[] | select(.isCrossRepository | not)]
              | sort_by(.mergedAt)
              | reverse
              | unique_by(.headRefName)
              | .[]
              | "\(.headRefName)\t#\(.number)"
            ' <<<"$merged_json"
          )

          candidates=()

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue

            if is_protected "$branch"; then
              echo "SKIP protected: ${branch}"
              continue
            fi

            if [[ -n "${OPEN_HEADS[$branch]+x}" ]]; then
              echo "SKIP open PR: ${branch}"
              continue
            fi

            if [[ -z "${MERGED_PR[$branch]+x}" ]]; then
              echo "SKIP not a merged-PR head: ${branch}"
              continue
            fi

            encoded="$(uri_encode "$branch")"
            if ! branch_json="$(gh api "repos/${GH_REPO}/branches/${encoded}" 2>/dev/null)"; then
              echo "SKIP already-deleted: ${branch}"
              continue
            fi

            last_commit="$(jq -r '.commit.commit.committer.date' <<<"$branch_json")"
            last_epoch="$(date -u -d "$last_commit" '+%s')"
            pr_ref="${MERGED_PR[$branch]}"

            if (( last_epoch > CUTOFF_EPOCH )); then
              echo "SKIP too recent: ${branch}  last_commit=${last_commit}  merged_pr=${pr_ref}"
              continue
            fi

            echo "CANDIDATE: ${branch}  last_commit=${last_commit}  merged_pr=${pr_ref}"
            candidates+=("$branch")
            printf '%s\n' "$branch" >> "$CANDIDATES_FILE"
          done <<<"$branches"

          echo ""
          if ((${#candidates[@]} == 0)); then
            echo "Would delete 0 branch(es)."
            echo "Empty list is normal for a solo repo, or if GitHub Automatically delete head branches is on."
          else
            echo "Would delete ${#candidates[@]} branch(es):"
            for branch in "${candidates[@]}"; do
              echo "  - ${branch}"
            done
          fi

      - name: Dry-run notice
        if: env.SHOULD_DELETE != 'true'
        shell: bash
        run: |
          echo "No deletions performed (dry-run)."
          echo "Set delete=true on a manual run, or wait for the weekly schedule (Monday 00:00 Asia/Kuala_Lumpur)."

      - name: Delete idle merged-PR heads
        if: env.SHOULD_DELETE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          CANDIDATES_FILE="${RUNNER_TEMP}/idle-merged-candidates.txt"

          uri_encode() {
            jq -nr --arg s "$1" '$s | @uri'
          }

          if [[ ! -s "$CANDIDATES_FILE" ]]; then
            echo "Nothing to delete."
            exit 0
          fi

          failed=0
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            encoded="$(uri_encode "$branch")"
            err_file="$(mktemp)"
            if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${encoded}" >/dev/null 2>"$err_file"; then
              echo "DELETED: ${branch}"
            elif grep -qiE 'HTTP 404|HTTP 422|Not Found|Reference does not exist' "$err_file"; then
              echo "SKIP already-deleted: ${branch}"
            else
              echo "::error::failed to delete ${branch}"
              cat "$err_file"
              failed=1
            fi
            rm -f "$err_file"
          done < "$CANDIDATES_FILE"

          if (( failed != 0 )); then
            exit 1
          fi
