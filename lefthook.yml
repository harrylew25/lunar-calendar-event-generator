pre-push:
  jobs:
    - name: typescript check
      run: bun run typescheck

    - name: unit tests check
      run: bun run test

pre-commit:
  parallel: true
  jobs:
    - name: biome check formatting
      run: bunx biome check --write --files-ignore-unknown=true --no-errors-on-unmatched -- {staged_files}
      glob: "*.{ts,tsx,js,json}"
      stage_fixed: true
